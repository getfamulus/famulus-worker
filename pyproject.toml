[project]
name = "famulus-worker"
version = "0.1.1"
description = "Runs Claude Code sessions in tmux on your machine and streams them to a Famulus backend"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["claude", "automation", "agent", "tmux", "task-runner"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "websockets>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.urls]
Homepage = "https://github.com/getfamulus/famulus"
Repository = "https://github.com/getfamulus/famulus-worker"
Issues = "https://github.com/getfamulus/famulus-worker/issues"

[project.scripts]
famulus-worker = "famulus_worker.worker:main_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/famulus_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
